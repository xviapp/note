<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页间</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 32px;
        min-height: 75vh;
        display: grid;
        align-content: center;
      }
      h1 {
        font-size: 24px;
        font-weight: 500;
      }
      p {
        max-width: 30em;
        line-height: 1.8;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <h1>请更新系统网页组件</h1>
    <p>
      页间需要 Android System WebView 125 或更新版本。请在手机应用商店更新 Android System WebView 和
      Chrome，然后重新打开页间。
    </p>
  </body>
</html>
